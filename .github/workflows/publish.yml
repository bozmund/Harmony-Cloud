name: publish image
on:
  push:
    branches: [main]
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/harmony-cloud-api:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/harmony-cloud-api:latest
      - name: Dispatch immutable image to Harmony Platform
        env:
          GH_TOKEN: ${{ secrets.PLATFORM_DISPATCH_TOKEN }}
        run: |
          gh api repos/${{ github.repository_owner }}/Harmony-Platform/dispatches \
            -f event_type=cloud-published \
            -f client_payload[cloud_image]=ghcr.io/${{ github.repository_owner }}/harmony-cloud-api:sha-${{ github.sha }}
